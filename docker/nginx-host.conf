# 宿主机 nginx 示例（非容器部署）：静态托管前端 dist 并代理后端
# 放置到 /etc/nginx/conf.d/htglxt.conf，修改 root 与 proxy_pass 后 nginx -s reload
server {
    listen       80;
    server_name  your-domain.com;
    root         /var/www/htglxt/apps/web/dist;
    index        index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html { add_header Cache-Control "no-cache"; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location /uploads/ {
        proxy_pass       http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 7d;
    }

    location = /metrics { deny all; }   # 指标仅内网 Prometheus 抓取
    location = /docs    { deny all; }   # 接口文档按需开放
}
