version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: htglxt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: htglxt_v2
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/server
      dockerfile: Dockerfile
    container_name: htglxt-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      DB_DATABASE: htglxt_v2
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?生产必须设置 JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?生产必须设置 JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-1000}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - upload-data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 生产不建议直接暴露给公网，交由 web 容器的 nginx 代理
    expose:
      - "3001"
    ports:
      - "${API_PORT:-3001}:3001"

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: htglxt-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

  # 可选：迁移作业（首次部署执行一次）
  migrate:
    build:
      context: ../apps/server
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      DB_DATABASE: htglxt_v2
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-placeholder-secret-0001}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-placeholder-secret-0002}
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  upload-data:
