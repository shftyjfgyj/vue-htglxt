# =====================================================================
# 本机生产部署用的 nginx 配置（Windows / 非管理员 / 监听 8080）
# 顶层是完整配置，直接用 -c 指定即可：
#   nginx.exe -p <nginx根> -c conf/htglxt.conf -t
# 若在 Linux 且以 root 运行，把 listen 改成 80，并按 docker/nginx-host.conf 放进 conf.d
# =====================================================================
worker_processes  auto;
error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
    access_log  logs/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    server {
        listen       8080;
        # 只监听本机；若需要局域网访问，把你的局域网 IP 加在这里
        server_name  localhost 127.0.0.1;

        # 前端构建产物。
        # 用相对路径：run-nginx.cmd 以 `-p .` 把 prefix 设为 nginx 解压目录，
        # 该目录是 <仓库>/.tmp-nginx/nginx-1.28.0，因此上两级即仓库根。
        # 这样换台机器、换个目录放仓库都不用改配置。
        root   ../../apps/web/dist;
        index  index.html;

        # 带内容指纹的静态资源：一年强缓存
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 入口 HTML 不缓存，保证发版即时生效
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # SPA history 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 后端 API
        location /api/ {
            proxy_pass         http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # 上传文件（后端静态目录）
        location /uploads/ {
            proxy_pass       http://127.0.0.1:3001;
            proxy_set_header Host $host;
            expires 7d;
        }

        # 内部端点不对公网/局域网暴露
        location = /metrics   { deny all; }
        location = /docs      { deny all; }
        location = /docs.json { deny all; }
        location = /health    { deny all; }
    }
}
