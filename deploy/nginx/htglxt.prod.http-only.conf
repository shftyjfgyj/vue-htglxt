# 首次上线的临时配置：只监听 80（不含证书），用于验证服务与申请证书
# 证书就绪后执行：cp deploy/nginx/htglxt.prod.conf deploy/nginx/active.conf
#                 docker compose -f docker/docker-compose.prod.yml restart web
upstream htglxt_api {
    server api:3001;
    keepalive 16;
}

server {
    listen 80;
    server_name your-domain.com;

    client_max_body_size 20m;
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    root  /usr/share/nginx/html;
    index index.html;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html { add_header Cache-Control "no-cache"; }

    location / { try_files $uri $uri/ /index.html; }

    location /api/ {
        proxy_pass         http://htglxt_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass       http://htglxt_api;
        proxy_set_header Host $host;
        expires 7d;
    }

    location = /metrics { deny all; }
    location = /docs    { deny all; }
}
