# =====================================================================
# 生产 Nginx（容器内）——被 docker-compose.prod.yml 挂载为 default.conf
# 关键点：
#   1. /api 反代到容器网络的 api:3001（用变量 + resolver，避免启动时解析不到上游）
#   2. 80 端口只保留 ACME 校验与 301 跳转
#   3. /assets 长缓存、index.html 不缓存（Vue 构建产物带 hash）
#   4. /metrics 与 /docs 一律拒绝，避免指标与接口文档暴露公网
# =====================================================================

upstream htglxt_api {
    server api:3001;
    keepalive 16;
}

# HTTP：ACME 校验 + 跳转 HTTPS
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com www.your-domain.com;

    # 证书：把阿里云下载的 pem/key 放到 deploy/nginx/certs/ 下
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /usr/share/nginx/html;
    index index.html;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;   # 封面图 2MB、Excel 导入留足余量

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 前端静态资源（Vite 产物带 hash，可长缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口
    location /api/ {
        proxy_pass         http://htglxt_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 上传文件（由 api 容器返回）
    location /uploads/ {
        proxy_pass       http://htglxt_api;
        proxy_set_header Host $host;
        expires 7d;
    }

    # 指标与接口文档不对外
    location = /metrics { deny all; }
    location = /docs    { deny all; }
}
