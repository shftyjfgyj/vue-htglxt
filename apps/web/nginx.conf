# 前端容器内的 nginx：静态托管 dist + 反向代理 API/上传目录
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # gzip：文本类资源压缩率最高
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 带指纹的静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，保证发版即时生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API：使用 Docker 内置 DNS + 变量延迟解析。
    # 若直接写 proxy_pass http://api:3001，nginx 会在「加载配置时」解析主机名，
    # 一旦 api 容器尚未就绪就会启动失败（nginx -t 即可复现：host not found in upstream "api"）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3001;

    location /api/ {
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # 上传文件（后端静态目录）
    location /uploads/ {
        proxy_pass       $api_upstream;
        proxy_set_header Host $host;
        expires 7d;
    }

    # 健康检查与指标不对公网开放
    location = /metrics { deny all; }
    location = /docs { deny all; }
}
